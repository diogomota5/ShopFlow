spring.application.name=ShopFlow

# ----- Banco de Dados ----- #
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate ----- #
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.delayed_drop=true

# ----- Jackson ----- #
spring.jackson.serialization.write-dates-as-timestamps=false

# ----- Flyway ----- #
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration 
spring.flyway.baseline-on-migrate=true

# ----- Servidor ----- #
server.port=8080

# ----- JWT ----- #
api.security.token.secret=${JWT_SECRET}

# ----- Cloudinary ----- #
cloudinary.cloud_name=${CLOUDINARY_NAME}
cloudinary.api_key=${CLOUDINARY_KEY}
cloudinary.api_secret=${CLOUDINARY_SECRET:}

