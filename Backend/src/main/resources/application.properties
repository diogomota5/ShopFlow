spring.application.name=ShopFlow
spring.config.import=optional:file:../Credenciais.env[.properties]

# ----- Banco de Dados ----- #
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/shopflow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----- JPA / Hibernate ----- #
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.delayed_drop=true

# ----- Jackson ----- #
spring.jackson.serialization.write-dates-as-timestamps=false

# ----- Flyway ----- #
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration 
spring.flyway.baseline-on-migrate=true

# ----- Servidor ----- #
server.port=8080

# ----- Actuator (health check para Docker) ----- #
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ----- E-mail ----- #
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}

# ----- JWT ----- #
api.security.token.secret=${JWT_SECRET}

# ----- Cloudinary -----#
cloudinary.cloud_name=${CLOUDINARY_NAME}
cloudinary.api_key=${CLOUDINARY_KEY}
cloudinary.api_secret=${CLOUDINARY_SECRET}

# ----- CORS -----#
cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}

